<!-- TaoCode 应用图标。
     形制照 ZCode 的应用图标：黑色圆角方底 + 居中的白色字标。字标是 **刷笔签名的花体「T.」**。
     这一笔的骨架（照着刷笔签名的走向，不是几何字形的棱角）：
       · **起笔**在左下角，先**向上**走一小段（签名的入笔）；
       · 在左上**回旋成一个开放的小环**——环从右下绕到左上、再向右下兜回来，是这枚字标的签名特征；
       · 环收住后向右转成**长浪横画**：上沿起拱、下沿随势收细，末端在右上渐收成锋。
     笔画粗细变化由轮廓本身承担（刷笔是靠外形的粗细写出来的），所以这是一条**闭合轮廓**，
     不是描边路径 —— 描边路径做不出起笔收锋。
     几何口径：
       · 画布 1024×1024，圆角半径 180（与 ZCode 同比例的 squircle）；
       · 字标外接框 644×644，四边留白各 190（上下左右相等，用户明确要求）；
       · 字标水平居中：左边缘 190、右边缘 834；垂直：顶边 190、基线 834。
     曲线的极值不在控制点上，外接框由折线化后实测（生成器会打印四边留白）。
     改这里就要同步跑 `node scripts/gen-app-icon.mjs` 与 `tests/app-icon.test.mjs`（.ico 由同一组数字栅格化）。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="TaoCode">
  <title>TaoCode</title>
  <rect x="0" y="0" width="1024" height="1024" rx="180" fill="#1A1A1A" />
  <g fill="#FFFFFF">
    <!-- 刷笔花体 T：一条闭合轮廓。
         外侧：起笔尾（190,834）→ 向左上兜起环的外弧 → 环顶（约 300,560）→ 转成横浪上沿 →
               向右上掠到横浪末端收锋（834,300）
         内侧：沿横浪下沿向左回到环的右上 → 环的内弧下行 → 收回到起笔尾的内沿 → 闭合。 -->
    <path d="M190 834
             C176 812 178 782 194 756
             C212 726 244 704 282 694
             C330 682 380 692 414 722
             C444 748 456 786 444 818
             C438 836 424 848 406 852
             C420 838 428 818 424 796
             C418 766 396 742 366 734
             C330 724 292 736 268 762
             C246 786 240 818 252 844
             C270 880 320 898 372 892
             C440 884 502 848 546 796
             C596 736 626 662 640 584
             C652 518 656 452 654 392
             C652 348 646 310 634 282
             C684 274 746 268 806 268
             C820 268 830 276 834 290
             C838 306 830 320 814 322
             C752 330 690 340 640 356
             C656 386 668 424 674 466
             C684 542 682 622 660 692
             C634 774 578 842 500 880
             C418 920 302 918 232 876
             C200 856 188 846 190 834 Z" />
    <!-- 方句点：坐在基线上，右边缘与字标右边缘齐平（834）。 -->
    <rect x="674" y="674" width="160" height="160" />
  </g>
</svg>